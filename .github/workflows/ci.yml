name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with pytest
        run: |
          python -m pytest tests/ -x -q --ignore=tests/test_configuraciones.py \
            -k "not test_guardar_recordar_true and not test_cargar_recordar_true and not test_agregar_al_carrito and not test_confirmar_deuda and not test_producto_rentable and not test_producto_en_perdida and not test_producto_sin_ganancia and not test_crear_licencia_exitosa and not test_crear_licencia_actualiza_existente and not test_renovar_licencia and not test_delega_a_servicio_licencias and not test_delega_con_dias_personalizados" \
            --tb=short

      - name: Run base de datos tests (core)
        run: |
          python -m pytest tests/test_base_datos.py -q --tb=short
