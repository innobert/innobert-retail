name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Lint with ruff
        run: |
          ruff check retail/

      - name: Type check with mypy (core modules)
        run: |
          mypy retail/nucleo/base_datos/ retail/nucleo/seguridad.py retail/nucleo/configuraciones.py retail/nucleo/cifrado.py retail/sesion/core/

      - name: Run all tests
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Run core database tests
        run: |
          python -m pytest tests/test_base_datos.py -q --tb=short
